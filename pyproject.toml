[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "houd2launcher"
version = "0.4.3"
description = "Local-first standalone project launcher for SideFX Houdini"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8,<3",
    "PySide6>=6.7,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5"]
build = ["pyinstaller>=6.10"]

[project.scripts]
houd2launcher = "houd2launcher.app:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
houd2launcher = ["resources/styles/*.qss", "resources/icons/*", "admin/static/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src", "houdini/python"]
testpaths = ["tests"]
addopts = "-ra"
